<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Edit User</title>

<link rel="stylesheet"
href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>

<header>

<h1>🪙 Pure Gold Invest</h1>

<p>Edit User</p>

</header>

<section class="card">

<h2>Edit User Account</h2>

<label>Full Name</label>

<input
type="text"
id="full_name">

<br><br>

<label>Phone</label>

<input
type="text"
id="phone">

<br><br>

<label>Available Balance</label>

<input
type="number"
id="available_balance">

<br><br>

<label>Total Profit</label>

<input
type="number"
id="total_profit">

<br><br>

<label>Amount Withdrawn</label>

<input
type="number"
id="amount_withdrawn">

<br><br>

<label>Role</label>

<select id="role">

<option value="user">User</option>

<option value="admin">Admin</option>

</select>

<br><br>

<button
onclick="saveUser()">

💾 Save Changes

</button>

<br><br>

<a href="admin-users.html">

<button>

⬅ Back

</button>

</a>

</section>

<script>

const SUPABASE_URL =
"https://jjydxddxxcqxgegkfgnh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_p8xWtXedN8AjaVKhdPhOgQ_Qwk2rAaH";

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

const params =
new URLSearchParams(
window.location.search
);

const userId =
params.get("id");

async function loadUser(){

const { data } =
await supabaseClient

.from("profiles")

.select("*")

.eq("id",userId)

.single();

document.getElementById("full_name").value =
data.full_name || "";

document.getElementById("phone").value =
data.phone || "";

document.getElementById("available_balance").value =
data.available_balance || 0;

document.getElementById("total_profit").value =
data.total_profit || 0;

document.getElementById("amount_withdrawn").value =
data.amount_withdrawn || 0;

document.getElementById("role").value =
data.role;

}
async function saveUser(){

const { error } =
await supabaseClient

.from("profiles")

.update({

full_name:
document.getElementById("full_name").value,

phone:
document.getElementById("phone").value,

available_balance:
Number(
document.getElementById("available_balance").value
),

total_profit:
Number(
document.getElementById("total_profit").value
),

amount_withdrawn:
Number(
document.getElementById("amount_withdrawn").value
),

role:
document.getElementById("role").value

})

.eq("id",userId);

if(error){

alert(error.message);

return;

}

alert("User updated successfully.");

window.location.href =
"admin-users.html";

}

loadUser();

</script>

</body>

</html>
