<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Messages</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#ece5dd;
display:flex;
height:100vh;
}

#users{
width:30%;
background:white;
border-right:1px solid #ddd;
overflow-y:auto;
}

.user{
padding:15px;
border-bottom:1px solid #eee;
cursor:pointer;
}

.user:hover{
background:#f5f5f5;
}

#chatArea{
flex:1;
display:flex;
flex-direction:column;
}

header{
background:#075e54;
color:white;
padding:15px;
font-size:20px;
font-weight:bold;
}

#chatBox{
flex:1;
padding:15px;
overflow-y:auto;
}

#bottom{
display:flex;
gap:10px;
padding:10px;
background:white;
}

#replyInput{
flex:1;
padding:12px;
}

#sendButton{
padding:12px 20px;
}

</style>

</head>

<body>

<div id="users"></div>

<div id="chatArea">

<header>

💬 Admin Messages

</header>

<div id="chatBox">

Select a user to view messages.

</div>

<div id="bottom">

<input
id="replyInput"
placeholder="Type your reply...">

<button
id="sendButton">

Send

</button>

</div>

</div>

<script>

const SUPABASE_URL =
"https://jjydxddxxcqxgegkfgnh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_p8xWtXedN8AjaVKhdPhOgQ_Qwk2rAaH";
const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);
  let selectedUser = null;


async function loadUsers(){

const { data, error } =

await supabaseClient
.from("messages")
.select("user_id");


if(error){

alert(error.message);

return;

}


const uniqueUsers =
[...new Set(data.map(item => item.user_id))];


const usersDiv =
document.getElementById("users");


usersDiv.innerHTML = "";


uniqueUsers.forEach(id=>{


usersDiv.innerHTML += `

<div class="user" onclick="openChat('${id}')">

${id}

</div>

`;

});


}


loadUsers();
  async function openChat(userId){

selectedUser = userId;


const { data, error } =

await supabaseClient

.from("messages")

.select("*")

.eq("user_id", userId)

.order("created_at",{ascending:true});


if(error){

alert(error.message);

return;

}


const chatBox =
document.getElementById("chatBox");


chatBox.innerHTML = "";


data.forEach(msg=>{


const senderClass =
msg.sender === "Admin"
?
"adminMessage"
:
"userMessage";


chatBox.innerHTML += `

<div class="${senderClass}">

${msg.message}

<br>

<small>

${new Date(msg.created_at).toLocaleString()}

</small>

</div>

`;

});


chatBox.scrollTop =
chatBox.scrollHeight;


}
  document
.getElementById("sendButton")
.addEventListener("click", async ()=>{


if(!selectedUser){

alert("Select a user first.");

return;

}


const input =
document.getElementById("replyInput");


const text =
input.value.trim();


if(text === ""){

return;

}


const { error } =

await supabaseClient

.from("messages")

.insert([{

user_id:selectedUser,

message:text,

sender:"Admin",

status:"Sent",

attachment_url:null,

is_read:false

}]);


if(error){

alert(error.message);

return;

}


input.value = "";


openChat(selectedUser);


});
  setInterval(()=>{

if(selectedUser){

openChat(selectedUser);

}

loadUsers();

},3000);

</script>

</body>

</html>
