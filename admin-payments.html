<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Payment Approval</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
font-family:Arial,sans-serif;
background:#f4f4f4;
padding:20px;
}

h1{
text-align:center;
}

.payment-card{
background:white;
padding:15px;
margin-bottom:15px;
border-radius:10px;
box-shadow:0 2px 5px rgba(0,0,0,.1);
}

button{
border:none;
padding:10px 18px;
border-radius:5px;
color:white;
cursor:pointer;
margin-right:10px;
}

.approve{
background:green;
}

.reject{
background:red;
}

</style>

</head>


<body>


<h1>💳 Admin Payments</h1>


<div id="paymentsList">

Loading payments...

</div>



<script>


const SUPABASE_URL =
"https://jjydxddxxcqxgegkfgnh.supabase.co";


const SUPABASE_KEY =
"sb_publishable_p8xWtXedN8AjaVKhdPhOgQ_Qwk2rAaH";


const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);



async function loadPayments(){


const { data, error } =
await supabaseClient
.from("payments")
.select("*")
.order("created_at",{ascending:false});



if(error){

document.getElementById("paymentsList").innerHTML =
error.message;

return;

}



let html = "";



if(!data || data.length === 0){

html="<p>No payments found.</p>";

}



data.forEach(payment=>{


let buttons = "";


if(payment.payment_status === "Pending Approval"){

buttons = `

<button
class="approve"
onclick="approvePayment('${payment.id}')">

Approve

</button>


<button
class="reject"
onclick="rejectPayment('${payment.id}')">

Reject

</button>

`;

}else if(payment.payment_status === "Approved"){

buttons =
"<h3 style='color:green;'>✅ Approved</h3>";

}else{

buttons =
"<h3 style='color:red;'>❌ Rejected</h3>";

}


html += `

<div class="payment-card">

<p><strong>User ID:</strong>

${payment.user_id}

</p>


<p><strong>Package ID:</strong>

${payment.package_id}

</p>


<p><strong>Amount:</strong>

$${Number(payment.amount).toLocaleString()}

</p>


<p><strong>Payment Receipt:</strong></p>

${
payment.proof_url
?
`
<a href="${payment.proof_url}" target="_blank">

<button>

📷 View Receipt

</button>

</a>
`
:
`
<p>No receipt uploaded</p>
`
}


<p><strong>Status:</strong>

${payment.payment_status}

</p>

${buttons}

</div>

`;

});


document.getElementById("paymentsList").innerHTML =
html;


}
  async function approvePayment(id){

await supabaseClient
.from("payments")
.select("*")
.eq("id", id)
.single();

alert(paymentError.message);

return;

}

await supabaseClient
.from("gold_packages")
.select("*")
.eq("id", payment.package_id)
.single();

alert(packageError.message);

return;

}

await supabaseClient
.from("purchases")
.insert([{

user_id: payment.user_id,

amount: payment.amount,

payment_status: "Approved",

profit: goldPackage.profit,

package_id: payment.package_id,

payment_id: payment.id

}]);

await supabaseClient
.from("payments")
.update({

payment_status:"Approved"

})
.eq("id", id);


if(updateError){

alert(updateError.message);

return;

}


alert("Payment approved successfully");


loadPayments();

}

await supabaseClient
.from("notifications")
.insert([{

title:"Payment Approved",

message:
"Your payment of $" +
Number(payment.amount).toLocaleString() +
" has been approved successfully. Your investment is now active.",

async function rejectPayment(id){



const { data: payment, error: paymentError } =
await supabaseClient
.from("payments")
.select("*")
.eq("id",id)
.single();



if(paymentError){

alert(paymentError.message);

return;

}




const { error:updateError } =
await supabaseClient
.from("payments")
.update({

payment_status:"Rejected"

})
.eq("id",id);



if(updateError){

alert(updateError.message);

return;

}
  const { error:notificationError } =
await supabaseClient
.from("notifications")
.insert([{

user_id:payment.user_id,

title:"Payment Rejected",

message:
"Unfortunately, your payment of $" +
Number(payment.amount).toLocaleString() +
" was rejected. Please contact support or submit a new payment.",

status:"Unread",

is_read:false

}]);



if(notificationError){

alert(notificationError.message);

return;

}



alert("Payment rejected successfully");


loadPayments();


}





loadPayments();



</script>


</body>

</html>
