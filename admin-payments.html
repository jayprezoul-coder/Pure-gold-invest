<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Payment Approval</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
font-family:Arial,sans-serif;
background:#f4f4f4;
padding:20px;
}

h1{
text-align:center;
}

.payment-card{

background:white;
padding:20px;
margin-bottom:15px;
border-radius:10px;
box-shadow:0 2px 5px rgba(0,0,0,.1);

}

button{

border:none;
padding:10px 18px;
border-radius:5px;
color:white;
cursor:pointer;
margin-right:10px;

}

.approve{

background:green;

}

.reject{

background:red;

}

.proof{

background:#333;

}

</style>

</head>


<body>


<h1>💳 Admin Payments</h1>


<div id="paymentsList">

Loading payments...

</div>



<script>


const supabaseUrl =
"https://jjydxddxxcqxgegkfgnh.supabase.co";


const supabaseKey =
"sb_publishable_p8xWtXedN8AjaVKhdPhOgQ_Qwk2rAaH";


const supabaseClient =
supabase.createClient(
supabaseUrl,
supabaseKey
);



async function loadPayments(){


const { data, error } =
await supabaseClient
.from("payments")
.select(`
*,
profiles:user_id(
full_name,
email
),
gold_packages:package_id(
name,
profit
)
`)
.order("created_at",{ascending:false});



if(error){

alert(error.message);

return;

}


let html = "";



if(!data || data.length === 0){

html="<p>No payments found.</p>";

}



data.forEach(payment=>{


let buttons = "";



if(payment.payment_status === "Pending Approval"){


buttons = `


<button
class="approve"
onclick="approvePayment('${payment.id}')">

Approve

</button>


<button
class="reject"
onclick="rejectPayment('${payment.id}')">

Reject

</button>


`;


}else if(payment.payment_status === "Approved"){


buttons =
"<h3 style='color:green;'>✅ Approved</h3>";


}else if(payment.payment_status === "Rejected"){


buttons =
"<h3 style='color:red;'>❌ Rejected</h3>";


}



html += `


<div class="payment-card">


<h3>👤 ${
payment.profiles?.full_name || "Unknown User"
}</h3>


<p>
📧 ${
payment.profiles?.email || "No email"
}
</p>


<p>
🪙 ${
payment.gold_packages?.name || "Premium Gold Investment Package"
}
</p>


<p>
💰 Amount:
<strong>
$${Number(payment.amount).toLocaleString()}
</strong>
</p>


<p>
📈 Profit:
<strong>
$${Number(payment.gold_packages?.profit || 0).toLocaleString()}
</strong>
</p>


`;
  ${payment.proof_url ? `

<a href="${payment.proof_url}" target="_blank">

<button class="proof">

📷 View Payment Proof

</button>

</a>

` : ""}



<p>

<strong>Status:</strong>

${payment.payment_status}

</p>


${buttons}


</div>


`;

});


document.getElementById("paymentsList").innerHTML =
html;


}





async function approvePayment(id){



const { data: payment, error: paymentError } =
await supabaseClient
.from("payments")
.select("*")
.eq("id",id)
.single();



if(paymentError){

alert(paymentError.message);

return;

}





const { data: goldPackage, error: packageError } =
await supabaseClient
.from("gold_packages")
.select("*")
.eq("id",payment.package_id)
.single();



if(packageError){

alert(packageError.message);

return;

}





const { data: purchase, error: purchaseError } =
await supabaseClient
.from("purchases")
.insert([{

user_id: payment.user_id,

package_id: payment.package_id,

amount: payment.amount,

payment_status:"Approved",

profit: goldPackage.profit

}])
.select()
.single();





if(purchaseError){

alert(purchaseError.message);

return;

}






const { error:updateError } =
await supabaseClient
.from("payments")
.update({

payment_status:"Approved",

purchase_id:purchase.id

})
.eq("id",id);





if(updateError){

alert(updateError.message);

return;

}




const { error:notificationError } =
await supabaseClient
.from("notifications")
.insert([{

user_id:payment.user_id,

title:"Payment Approved",

message:
"Your payment of $" +
Number(payment.amount).toLocaleString() +
" has been approved successfully. Your investment is now active.",

status:"Unread",

is_read:false

}]);





if(notificationError){

alert(notificationError.message);

return;

}




alert("Payment approved successfully");


loadPayments();


}




async function rejectPayment(id){


const { data: payment, error: paymentError } =
await supabaseClient
.from("payments")
.select("*")
.eq("id",id)
.single();



if(paymentError){

alert(paymentError.message);

return;

}
const { error:updateError } =
await supabaseClient
.from("payments")
.update({

payment_status:"Rejected"

})
.eq("id",id);



if(updateError){

alert(updateError.message);

return;

}




const { error:notificationError } =
await supabaseClient
.from("notifications")
.insert([{

user_id:payment.user_id,

title:"Payment Rejected",

message:
"Unfortunately, your payment of $" +
Number(payment.amount).toLocaleString() +
" was rejected. Please contact support or submit a new payment.",

status:"Unread",

is_read:false

}]);



if(notificationError){

alert(notificationError.message);

return;

}



alert("Payment rejected successfully");


loadPayments();


}





loadPayments();


</script>


</body>

</html>
