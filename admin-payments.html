<!DOCTYPE html>
<html>
<head>

<title>Admin Payment Approval</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
font-family:Arial,sans-serif;
padding:20px;
background:#f4f4f4;
}

h1{
text-align:center;
}

.payment-card{

background:white;
padding:15px;
margin:15px 0;
border-radius:10px;

}

button{

background:green;
color:white;
border:none;
padding:10px 15px;
border-radius:5px;

}

</style>

</head>


<body>


<h1>Admin Payments</h1>


<div id="paymentsList">

Loading payments...

</div>


<script>


// YOUR EXISTING SUPABASE CONNECTION GOES HERE

const supabaseUrl = "https://jjydxddxxcqxgegkfgnh.supabase.co";

const supabaseKey = "sb_publishable_p8xWtXedN8AjaVKhdPhOgQ_Qwk2rAaH";


const supabaseClient = supabase.createClient(
supabaseUrl,
supabaseKey
);



async function loadPayments(){


const {data,error}=await supabaseClient
.from("payments")
.select("*");


if(error){

document.getElementById("paymentsList").innerHTML =
error.message;

return;

}


if(error){

document.getElementById("paymentsList").innerHTML =
error.message;

return;

}



let html="";



data.forEach(payment=>{


html += `

<div class="payment-card">

<p>User ID: ${payment.user_id}</p>

<p>Amount: $${payment.amount}</p>

<p>Status: ${payment.payment_status}</p>


<button onclick="approvePayment('${payment.id}')">

Approve

</button>


</div>

`;



});



document.getElementById("paymentsList").innerHTML=html;



}



loadPayments();
  async function approvePayment(id){


// Get payment details

const { data: payment, error: paymentError } =
await supabaseClient
.from("payments")
.select("*")
.eq("id", id)
.single();



if(paymentError){

alert(paymentError.message);

return;

}



// Create purchase record

const { data: purchase, error: purchaseError } =
await supabaseClient
.from("purchases")
.insert([{

user_id: payment.user_id,

package_id: null,

amount: payment.amount,

payment_status: "Approved",

profit: 0

}])
.select()
.single();



if(purchaseError){

alert(purchaseError.message);

return;

}



// Update payment

const { error: updateError } =
await supabaseClient
.from("payments")
.update({

payment_status:"Approved",

purchase_id:purchase.id

})
.eq("id",id);



if(updateError){

alert(updateError.message);

return;

}



// Send notification

const { error: notificationError } =
await supabaseClient
.from("notifications")
.insert([{

user_id: payment.user_id,

title:"Payment Approved",

message:
"Your payment of $" +
Number(payment.amount).toLocaleString() +
" has been approved successfully. Your investment is now active.",

status:"Unread",

is_read:false

}]);



if(notificationError){

alert(notificationError.message);

return;

}



alert("Payment approved successfully");


loadPayments();


}
  </script>


</body>

</html>
