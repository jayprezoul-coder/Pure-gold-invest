<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Admin Payment Approval</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:Arial,sans-serif;

background:#f4f4f4;

padding:20px;

}

h1{

text-align:center;

margin-bottom:20px;

}

.payment-card{

background:#fff;

padding:15px;

margin-bottom:15px;

border-radius:10px;

box-shadow:0 2px 5px rgba(0,0,0,.1);

}

.payment-card p{

margin:8px 0;

}

button{

border:none;

padding:10px 18px;

border-radius:5px;

cursor:pointer;

color:#fff;

margin-right:8px;

margin-top:10px;

}

.approve{

background:green;

}

.reject{

background:red;

}

.view{

background:#0066ff;

}

.success{

color:green;

font-weight:bold;

}

.failed{

color:red;

font-weight:bold;

}

</style>

</head>

<body>

<h1>💳 Admin Payments</h1>

<div id="paymentsList">

Loading payments...

</div>

<script>

const SUPABASE_URL =
"https://jjydxddxxcqxgegkfgnh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_p8xWtXedN8AjaVKhdPhOgQ_Qwk2rAaH";
const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

async function loadPayments(){

const { data,error } =
await supabaseClient
.from("payments")
.select("*")
.order("created_at",
{ascending:false});

if(error){

document.getElementById(
"paymentsList"
).innerHTML=error.message;

return;

}

let html="";
  if(!data || data.length===0){

html="<h3>No payments found.</h3>";

}

data.forEach(payment=>{

let buttons="";

if(payment.payment_status==="Pending Approval"){

buttons=`

<button
class="approve"
onclick="approvePayment('${payment.id}')">

Approve

</button>

<button
class="reject"
onclick="rejectPayment('${payment.id}')">

Reject

</button>

`;

}else if(payment.payment_status==="Approved"){

buttons=`

<h3 class="success">

✅ Approved

</h3>

`;

}else{

buttons=`

<h3 class="failed">

❌ Rejected

</h3>

`;

}

html+=`

<div class="payment-card">

<p>

<strong>User ID:</strong>

${payment.user_id}

</p>

<p>

<strong>Package ID:</strong>

${payment.package_id}

</p>

<p>

<strong>Amount:</strong>

$${Number(payment.amount).toLocaleString()}

</p>

<p>

<strong>Status:</strong>

${payment.payment_status}

</p>

${
payment.proof_url
?

`
<a
href="${payment.proof_url}"
target="_blank">

<button
class="view">

📷 View Receipt

</button>

</a>

`

:

"<p>No receipt uploaded.</p>"

}

${buttons}

</div>

`;

});

document.getElementById(
"paymentsList"
).innerHTML=html;

}
  async function approvePayment(id) {

const { error } = await supabaseClient.rpc("approve_payment", {
    payment_id: Number(id)
});

if (error) {
    alert(error.message);
    return;
}
    await fetch("https://hook.eu1.make.com/g79cjr3vuagc9ufyrn8ae5p5jultgqau", {
  method: "POST",
  headers: {
    "Content-Type": "application/json"
  },
  body: JSON.stringify({
    payment_id: id,
    status: "Approved"
  })
});

alert("✅ Payment approved successfully");

loadPayments();

}
  



  async function rejectPayment(id){

const { data:payment,error:paymentError } =
await supabaseClient
.from("payments")
.select("*")
.eq("id",id)
.single();

if(paymentError){

alert(paymentError.message);

return;

}


if(payment.payment_status==="Rejected"){

alert("This payment has already been rejected.");

return;

}


const { error:updateError } =
await supabaseClient
.from("payments")
.update({

payment_status:"Rejected"

})
.eq("id",id);

if (updateError) {
    console.log(updateError);
    alert(JSON.stringify(updateError));
    return;
}

alert("Payment table updated successfully");
    const { error:notificationError } =
await supabaseClient
.from("notifications")
.insert([{

user_id:payment.user_id,

title:"Payment Rejected",

message:
"Unfortunately, your payment of $" +
Number(payment.amount).toLocaleString() +
" was rejected. Please contact support or submit a new payment.",

status:"Unread",

is_read:false

}]);


if(notificationError){

alert(notificationError.message);

return;

}


alert("Payment rejected successfully");

loadPayments();

}
  loadPayments();

</script>

</body>

</html>
