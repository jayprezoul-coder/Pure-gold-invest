<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pure Gold Invest - Manage Users</title>

<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>

<header>
<h1>🪙 Pure Gold Invest</h1>
<p id="welcome">Loading...</p>
</header>

<section>

<h2>👥 Manage Users</h2>

<input
type="text"
id="search"
placeholder="Search by name or email">

<br><br>

<div id="users">

<p>Loading users...</p>

</div>

<br>

<a href="admin-dashboard.html">
<button>
⬅ Back to Dashboard
</button>
</a>

</section>

<script>

const SUPABASE_URL =
"https://jjydxddxxcqxgegkfgnh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_p8xWtXedN8AjaVKhdPhOgQ_Qwk2rAaH";

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

let allUsers = [];

async function loadUsers(){

const { data:{ user } } =
await supabaseClient.auth.getUser();

if(!user){

window.location.href =
"login-final.html";

return;

}

const { data: admin } =
await supabaseClient
.from("profiles")
.select("role")
.eq("id",user.id)
.single();

if(!admin || admin.role !== "admin"){

alert("Access denied.");

window.location.href =
"dashboard-final.html";

return;

}

document.getElementById("welcome").innerText =
"Welcome Admin";

const { data } =
await supabaseClient
.from("profiles")
.select("*")
.order("created_at",{ascending:false});

allUsers = data || [];

displayUsers(allUsers);

}

function displayUsers(users){

const box =
document.getElementById("users");

box.innerHTML = "";

if(users.length===0){

box.innerHTML =
"<p>No users found.</p>";

return;

}

users.forEach(user=>{

box.innerHTML += `

<div class="card">

<h3>${user.full_name || "No Name"}</h3>

<p><strong>Email:</strong>
${user.email || ""}</p>

<p><strong>Phone:</strong>
${user.phone || "-"}</p>

<p><strong>Role:</strong>
${user.role}</p>

<p><strong>Available Balance:</strong>
$${Number(user.available_balance || 0).toLocaleString()}</p>

<p><strong>Total Profit:</strong>
$${Number(user.total_profit || 0).toLocaleString()}</p>

<p><strong>Amount Withdrawn:</strong>
$${Number(user.amount_withdrawn || 0).toLocaleString()}</p>

<button
onclick="editUser('${user.id}')">

Edit User

</button>

<hr>

</div>

`;

});

}
  document
.getElementById("search")
.addEventListener("input", function(){

const value =
this.value.toLowerCase();

const filtered =
allUsers.filter(user =>

(user.full_name || "")
.toLowerCase()
.includes(value)

||

(user.email || "")
.toLowerCase()
.includes(value)

);

displayUsers(filtered);

});

function editUser(id){

window.location.href =
"admin-edit-user.html?id=" + id;

}

loadUsers();

</script>

</body>

</html>
