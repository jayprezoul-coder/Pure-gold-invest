<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pure Gold Invest - Login</title>
  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<header>
  <h1>🪙 Pure Gold Invest</h1>
  <p>Secure Account Login</p>
</header>

<section>

<h2>Login</h2>

<form id="loginForm">

<input id="email" type="email" placeholder="Email Address" required>
<br><br>

<input id="password" type="password" placeholder="Password" required>
<br><br>

<button type="submit">Login</button>

</form>

<p id="message"></p>

<br>

<a href="index-new.html">
<button type="button">Back Home</button>
</a>

</section>


<script>
const SUPABASE_URL = "https://jjydxddxxcqxgegkfgnh.supabase.co";
const SUPABASE_KEY = "sb_publishable_p8xWtXedN8AjaVKhdPhOgQ_Qwk2rAaH";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const message = document.getElementById("message");

  message.innerText = "Logging in...";

  const { error } = await supabaseClient.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    message.innerText = error.message;
    return;
  }

  message.innerText = "Login successful!";

  window.location.href = "dashboard-final.html";
});
</script>

</body>
</html>
