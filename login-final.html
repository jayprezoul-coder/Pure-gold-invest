<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pure Gold Invest - Login</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>


<body>


<header>

<img
src="68460401-CB97-4ACC-9C77-3BFE519F9170.png"
alt="Pure Gold Invest Logo"
class="logo">

<h1>Pure Gold Invest</h1>

<p>Secure Account Login</p>
</header>



<section>


<h2>Login</h2>


<form id="loginForm">


<input

id="email"

type="email"

placeholder="Email Address"

required

>


<br><br>



<input

id="password"

type="password"

placeholder="Password"

required

>


<br><br>



<button type="submit">

Login

</button>


</form>



<p id="message"></p>



<br>


<a href="index-new.html">

<button type="button">

Back Home

</button>

</a>



<br><br>



<p>Don't have an account?</p>



<a href="signup-final.html">

<button type="button">

Create Account

</button>

</a>


</section>
<script>


const SUPABASE_URL = 
"https://jjydxddxxcqxgegkfgnh.supabase.co";


const SUPABASE_KEY = 
"sb_publishable_p8xWtXedN8AjaVKhdPhOgQ_Qwk2rAaH";


const supabaseClient = supabase.createClient(

SUPABASE_URL,

SUPABASE_KEY

);




document

.getElementById("loginForm")

.addEventListener("submit", async (e)=>{


e.preventDefault();



const email =

document.getElementById("email").value;



const password =

document.getElementById("password").value;



const message =

document.getElementById("message");



message.innerText =

"Logging in...";





const { data, error } =

await supabaseClient.auth.signInWithPassword({

email,

password

});




if(error){


message.innerText = error.message;


return;


}





await supabaseClient.auth.setSession({

access_token: data.session.access_token,

refresh_token: data.session.refresh_token

});





const { data: profile, error: profileError } =

await supabaseClient

.from("profiles")

.select("role")

.eq("id", data.user.id)

.single();





if(profileError){


message.innerText = profileError.message;


return;


}





message.innerText =

"Login successful!";





setTimeout(()=>{


if(profile.role === "admin"){


window.location.href =

"admin-dashboard.html";


}else{


window.location.href =

"dashboard-final.html";


}


},1000);





});


</script>



</body>

</html>
