<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Message Admin</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#ece5dd;
}

header{
background:#075e54;
color:white;
padding:15px;
display:flex;
align-items:center;
gap:10px;
font-size:20px;
font-weight:bold;
}

header button{
background:none;
border:none;
color:white;
font-size:22px;
}

#chatBox{
height:calc(100vh - 150px);
overflow-y:auto;
padding:15px;
display:flex;
flex-direction:column;
gap:10px;
}

.userMessage{
align-self:flex-end;
background:#dcf8c6;
padding:10px;
border-radius:10px;
max-width:80%;
}

.adminMessage{
align-self:flex-start;
background:white;
padding:10px;
border-radius:10px;
max-width:80%;
}

.time{
font-size:11px;
color:gray;
margin-top:5px;
}

#bottom{
position:fixed;
bottom:0;
left:0;
right:0;
background:white;
display:flex;
padding:10px;
gap:10px;
}

#messageInput{
flex:1;
padding:12px;
border-radius:20px;
border:1px solid #ccc;
}

#sendButton{
background:#075e54;
color:white;
border:none;
padding:12px 20px;
border-radius:20px;
}

</style>

</head>


<body>


<header>

<button onclick="history.back()">←</button>

<span>💬 Message Admin</span>

</header>


<div id="chatBox">

</div>


<div id="bottom">

<input
id="messageInput"
placeholder="Type a message...">


<button id="sendButton">

Send

</button>

</div>
<script>

const SUPABASE_URL =
"https://jjydxddxxcqxgegkfgnh.supabase.co";


const SUPABASE_KEY =
"sb_publishable_p8xWtXedN8AjaVKhdPhOgQ_Qwk2rAaH"


const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


let currentUser = null;



async function getUser(){

const { data:{ user } } =
await supabaseClient.auth.getUser();


if(!user){

window.location.href="login-final.html";

return;

}


currentUser = user;


loadMessages();


}



async function loadMessages(){


const { data, error } =

await supabaseClient

.from("messages")

.select("*")

.eq("user_id", currentUser.id)

.order("created_at",{ascending:true});



if(error){

console.log(error.message);

return;

}



const chatBox =
document.getElementById("chatBox");


chatBox.innerHTML="";



data.forEach(message=>{


let boxClass =
message.sender === "Admin"
?
"adminMessage"
:
"userMessage";



chatBox.innerHTML += `


<div class="${boxClass}">


${message.message}


<div class="time">

${new Date(message.created_at)
.toLocaleString()}

</div>


</div>


`;



});



chatBox.scrollTop =
chatBox.scrollHeight;


}



getUser();




document
.getElementById("sendButton")
.addEventListener("click", async ()=>{


const input =
document.getElementById("messageInput");


const text =
input.value.trim();



if(text === ""){

return;

}




const { error } =

await supabaseClient

.from("messages")

.insert([{

user_id: currentUser.id,

message: text,

sender: "User",

status: "Sent",

attachment_url: null,

is_read: false

}]);





if(error){

alert(error.message);

return;

}




input.value = "";



loadMessages();



});
  setInterval(()=>{

if(currentUser){

loadMessages();

}

},3000);
  </script>


</body>

</html>
