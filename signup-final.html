<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pure Gold Invest - Create Account</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>


<body>

<header>

<img
src="50FD820B-B4B7-48D9-AA24-CC9D63B20B4E.png"
alt="Pure Gold Invest Logo"
class="logo">

<h1>🪙 Pure Gold Invest</h1>

<p>Create your investment account</p>

</header>


<header>

<h1>🪙 Pure Gold Invest</h1>

<p>Create your investment account</p>

</header>



<section>


<h2>Create Account</h2>


<form id="signupForm">


<input 
id="fullName"
type="text"
placeholder="Full Name"
required>

<br><br>


<input 
id="email"
type="email"
placeholder="Email Address"
required>

<br><br>


<input 
id="password"
type="password"
placeholder="Create Password"
required>

<br><br>


<button type="submit">
Create Account
</button>


</form>


<p id="message"></p>


<br>


<a href="login-final.html">

<button type="button">
Already have an account? Login
</button>

</a>


</section>




<script>


const SUPABASE_URL =
"https://jjydxddxxcqxgegkfgnh.supabase.co";


const SUPABASE_KEY =
"sb_publishable_p8xWtXedN8AjaVKhdPhOgQ_Qwk2rAaH";


const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);



document
.getElementById("signupForm")
.addEventListener("submit", async (e)=>{


e.preventDefault();



const fullName =
document.getElementById("fullName").value;


const email =
document.getElementById("email").value;


const password =
document.getElementById("password").value;


const message =
document.getElementById("message");



message.innerText =
"Creating account...";



const { error } =

await supabaseClient.auth.signUp({

email,

password,

options: {

data: {

full_name: fullName

}

}

});



if(error){

message.innerText =
error.message;

return;

}



message.innerText =
"Account created successfully! Please login.";



setTimeout(()=>{

window.location.href =
"login-final.html";

},1500);



});


</script>


</body>

</html>
