<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Withdraw Profit</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>

<header>

<h1>💸 Withdraw Profit</h1>

</header>

<section>

<div class="card">

<h3>Available Profit</h3>

<h2 id="availableProfit">$0</h2>

</div>

<br>

<div class="card">

<label>Withdrawal Amount</label>

<input
type="number"
id="amount"
placeholder="Enter amount">

<br><br>

<label>Withdrawal Fee</label>

<input
type="text"
value="$15,000"
readonly>

<br><br>

<label>Bank Name</label>

<input
type="text"
id="bankName"
placeholder="Enter bank name">

<br><br>

<label>Account Name</label>

<input
type="text"
id="accountName"
placeholder="Enter account name">

<br><br>

<label>Account Number</label>

<input
type="text"
id="accountNumber"
placeholder="Enter account number">

<br><br>

<p>
<strong>Note:</strong> A withdrawal processing fee of $15,000 applies to this request.
</p>

<br>

<button id="submitWithdrawal">

Submit Withdrawal

</button>

</div>

</section>

<script>

const SUPABASE_URL =
"https://jjydxddxxcqxgegkfgnh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_p8xWtXedN8AjaVKhdPhOgQ_Qwk2rAaH";

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);
  async function loadUser(){

const { data:{ user } } =
await supabaseClient.auth.getUser();

if(!user){

window.location.href =
"login-final.html";

return;

}

window.currentUser = user;

const { data: profile, error } =
await supabaseClient
.from("profiles")
.select("total_profit")
.eq("id", user.id)
.single();

if(error){

alert(error.message);

return;

}

document.getElementById("availableProfit").innerText =
"$" + Number(profile.total_profit || 0).toLocaleString();

}

loadUser();
  document
.getElementById("submitWithdrawal")
.addEventListener("click", async ()=>{

const amount =
document.getElementById("amount").value.trim();

const bankName =
document.getElementById("bankName").value.trim();

const accountName =
document.getElementById("accountName").value.trim();

const accountNumber =
document.getElementById("accountNumber").value.trim();

if(
amount==="" ||
bankName==="" ||
accountName==="" ||
accountNumber===""){
alert("Please complete all fields.");
return;
}

const { error } =
await supabaseClient
.from("withdrawals")
.insert([{

user_id: currentUser.id,

amount: Number(amount),

bank_name: bankName,

account_name: accountName,

account_number: accountNumber,

status: "Pending"

}]);

if(error){

alert(error.message);

return;

}

alert("Your withdrawal request has been submitted successfully.");

document.getElementById("amount").value = "";

document.getElementById("bankName").value = "";

document.getElementById("accountName").value = "";

document.getElementById("accountNumber").value = "";

});
  </script>

</body>

</html>
